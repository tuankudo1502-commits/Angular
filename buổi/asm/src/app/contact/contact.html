<section class="contact-section">
  <div class="contact-container">
    <div class="contact-header">
      <span class="sub-title">Kết nối với chúng tôi</span>
      <h1>Sẵn sàng hỗ trợ bạn 24/7</h1>
    </div>

    <div class="contact-wrapper">
      <div class="contact-info">
        <div class="info-box">
          <h3>Trụ sở chính</h3>
          <p>Tòa nhà L&P, Công viên phần mềm Quang Trung<br />Quận 12, TP. Hồ Chí Minh</p>
        </div>

        <div class="info-box">
          <h3>Hỗ trợ giao dịch</h3>
          <p>Email: support@lpstore.com</p>
          <p>Hotline: (+84) 123 456 789</p>
        </div>

        <div class="info-box">
          <h3>Cộng đồng</h3>
          <div class="social-grid">
            <a href="#"><i class="bx bxl-discord-alt"></i> Discord</a>
            <a href="#"><i class="bx bxl-facebook-circle"></i> Facebook</a>
            <a href="#"><i class="bx bxl-telegram"></i> Telegram</a>
          </div>
        </div>
      </div>

      <div class="contact-form-container">
        <form class="contact-form">
          <div class="input-group">
            <input type="text" placeholder="Họ và tên" required />
          </div>
          <div class="input-group">
            <input type="email" placeholder="Địa chỉ email" required />
          </div>
          <div class="input-group">
            <select>
              <option value="">Chủ đề cần hỗ trợ</option>
              <option value="trade">Vấn đề giao dịch (Trade)</option>
              <option value="payment">Thanh toán / Nạp tiền</option>
              <option value="collab">Hợp tác kinh doanh</option>
              <option value="other">Vấn đề khác</option>
            </select>
          </div>
          <div class="input-group">
            <textarea placeholder="Tin nhắn của bạn..." rows="5" required></textarea>
          </div>
          <button type="submit" class="btn-send">
            Gửi yêu cầu <i class="bx bx-right-arrow-alt"></i>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
